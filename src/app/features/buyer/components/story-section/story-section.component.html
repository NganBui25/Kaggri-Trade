<section class="story-wrapper" aria-labelledby="story-title">
  <div class="story-card">
    <!-- Left Copy & Button -->
    <div class="story-content">
      <h2 id="story-title" class="story-heading">
        Lựa chọn nhỏ.<br>
        Ý nghĩa lớn.
      </h2>
      <p class="story-desc">
        Mỗi lựa chọn nông sản theo mùa giúp kết nối gần hơn với người trồng.
      </p>
      <button (click)="onStory()" type="button" class="story-cta-btn">
        Câu chuyện nhà vườn
        <span class="arrow">→</span>
      </button>
    </div>

    <!-- Right 4 Points -->
    <div class="story-points">
      <div class="story-point">
        <span class="point-icon" aria-hidden="true">
          <svg class="w-7 h-7 mx-auto text-[#0d623b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        </span>
        <strong class="point-title">Theo mùa</strong>
        <small class="point-subtitle">Chọn theo vụ thu hoạch</small>
      </div>

      <div class="story-point">
        <span class="point-icon" aria-hidden="true">
          <svg class="w-7 h-7 mx-auto text-[#0d623b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </span>
        <strong class="point-title">Rõ nguồn</strong>
        <small class="point-subtitle">Biết nơi sản phẩm bắt đầu</small>
      </div>

      <div class="story-point">
        <span class="point-icon" aria-hidden="true">
          <svg class="w-7 h-7 mx-auto text-[#0d623b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22v-9m0 0a5 5 0 015-5h2a7 7 0 01-7 7m0-2a5 5 0 00-5-5H5a7 7 0 007 7" /></svg>
        </span>
        <strong class="point-title">Gần người trồng</strong>
        <small class="point-subtitle">Kết nối địa phương</small>
      </div>

      <div class="story-point">
        <span class="point-icon" aria-hidden="true">
          <svg class="w-7 h-7 mx-auto text-[#0d623b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
        </span>
        <strong class="point-title">Bền lâu</strong>
        <small class="point-subtitle">Trân trọng mỗi vụ mùa</small>
      </div>
    </div>
  </div>
</section>
