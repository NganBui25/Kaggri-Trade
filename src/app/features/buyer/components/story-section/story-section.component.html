<section class="story-wrapper" aria-labelledby="story-title">
  <div class="story-card">
    <!-- Left Copy & Button -->
    <div class="story-content">
      <h2 id="story-title" class="story-heading">
        Lựa chọn nhỏ.<br>
        Ý nghĩa lớn.
      </h2>
      <p class="story-desc">
        Mỗi lựa chọn nông sản theo mùa giúp kết nối gần hơn với người trồng.
      </p>
      <button (click)="onStory()" type="button" class="story-cta-btn">
        Câu chuyện nhà vườn
        <span class="arrow">→</span>
      </button>
    </div>

    <!-- Right 4 Points -->
    <div class="story-points">
      <div class="story-point">
        <span class="point-icon" aria-hidden="true">✳</span>
        <strong class="point-title">Theo mùa</strong>
        <small class="point-subtitle">Chọn theo vụ thu hoạch</small>
      </div>

      <div class="story-point">
        <span class="point-icon" aria-hidden="true">⌕</span>
        <strong class="point-title">Rõ nguồn</strong>
        <small class="point-subtitle">Biết nơi sản phẩm bắt đầu</small>
      </div>

      <div class="story-point">
        <span class="point-icon" aria-hidden="true">♧</span>
        <strong class="point-title">Gần người trồng</strong>
        <small class="point-subtitle">Kết nối địa phương</small>
      </div>

      <div class="story-point">
        <span class="point-icon" aria-hidden="true">♡</span>
        <strong class="point-title">Bền lâu</strong>
        <small class="point-subtitle">Trân trọng mỗi vụ mùa</small>
      </div>
    </div>
  </div>
</section>
