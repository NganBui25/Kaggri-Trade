<div class="space-y-2">
  <label class="block text-xs font-bold uppercase tracking-wider text-emerald-950/70">
    Chọn vai trò đăng nhập <span class="text-rose-500">*</span>
  </label>
  
  <div class="grid grid-cols-3 gap-2 p-1.5 bg-emerald-50/70 border border-emerald-100 rounded-2xl">
    @for (item of roles; track item.role) {
      <button
        type="button"
        (click)="selectRole(item.role)"
        [class.bg-white]="selectedRole() === item.role"
        [class.shadow-md]="selectedRole() === item.role"
        [class.border-emerald-600]="selectedRole() === item.role"
        [class.text-emerald-900]="selectedRole() === item.role"
        [class.text-stone-600]="selectedRole() !== item.role"
        [class.hover:bg-emerald-100/50]="selectedRole() !== item.role"
        class="relative flex flex-col items-center justify-center py-2.5 px-2 rounded-xl border border-transparent transition-all duration-200 text-center group cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
      >
        <!-- Icon badge -->
        <span 
          class="w-6 h-6 mb-1 flex items-center justify-center transform transition-transform duration-200 group-hover:scale-110"
          [class.scale-110]="selectedRole() === item.role"
        >
          @if (item.role === 'buyer') {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
          } @else if (item.role === 'vendor') {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
          }
        </span>

        <!-- Title -->
        <span class="text-xs sm:text-sm font-bold tracking-tight leading-tight">
          {{ item.label }}
        </span>

        <!-- Small subtitle -->
        <span 
          class="text-[10px] hidden sm:block mt-0.5 font-medium transition-colors"
          [class.text-emerald-700]="selectedRole() === item.role"
          [class.text-stone-400]="selectedRole() !== item.role"
        >
          {{ item.role === 'buyer' ? 'Bên Mua' : item.role === 'vendor' ? 'Bên Bán' : 'Hệ Thống' }}
        </span>

        <!-- Active Indicator Dot -->
        @if (selectedRole() === item.role) {
          <span class="absolute -top-1 -right-1 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-600"></span>
          </span>
        }
      </button>
    }
  </div>
</div>
